<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨量數據圖表</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #chart_div {
            width: 100%;
            height: 100%;
            min-width: 320px;
            min-height: 300px;
            max-width: 100%;
            max-height: 100%;
            box-sizing: border-box;
            position: relative;
        }

        @media (max-width: 768px) {
            #chart_div {
                min-height: 250px;
            }
        }
    </style>
    <script type="text/javascript">
        google.charts.load('current', { 'packages': ['corechart'] });
        google.charts.setOnLoadCallback(drawChart);

        function getParameterByName(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function drawChart() {
            const fileUrl = getParameterByName('file');
            if (!fileUrl) {
                console.error('未指定檔案 URL');
                return;
            }

            fetch(fileUrl)
                .then(response => response.json())
                .then(data => {
                    const dataList = data.DataList;
                    if (!dataList || !Array.isArray(dataList)) {
                        console.error('數據格式無效');
                        return;
                    }

                    let dataTable = new google.visualization.DataTable();
                    dataTable.addColumn('string', '日期');
                    dataTable.addColumn('number', '累積雨量');
                    dataTable.addColumn('number', '歷史同期平均雨量');

                    dataList.forEach(item => {
                        let date = new Date(item.Date);
                        let formattedDate = `${date.getFullYear()}-${(date.getMonth() + 1)
                            .toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`;
                        dataTable.addRow([
                            formattedDate,
                            parseFloat(item['2020Rain']),
                            parseFloat(item['AverageRain'])
                        ]);
                    });

                    let dates = dataTable.getDistinctValues(0);
                    let ticks = dates.filter(date => date.endsWith('-01')); // 每月1日顯示一次

                    let options = {
                        curveType: 'function',
                        legend: {
                            position: 'top',
                            textStyle: {
                                color: 'black',
                                fontSize: 14,
                                bold: true
                            }
                        },
                        hAxis: {
                            title: '日期',
                            gridlines: { count: -1 },
                            ticks: ticks,
                            textStyle: {
                                fontSize: 12,
                                bold: true
                            }
                        },
                        vAxis: {
                            title: '雨量 (毫米)',
                            format: 'decimal',
                            viewWindow: { min: 0 },
                            gridlines: { count: -1 },
                            textStyle: {
                                fontSize: 12,
                                bold: true
                            }
                        },
                        series: {
                            0: { color: 'red', targetAxisIndex: 0 },
                            1: { color: 'blue', targetAxisIndex: 0 }
                        },
                        tooltip: { trigger: 'both' },
                        focusTarget: 'category',
                        chartArea: { left: '10%', top: '15%', width: '80%', height: '70%' }
                    };

                    let chart = new google.visualization.LineChart(document.getElementById('chart_div'));
                    chart.draw(dataTable, options);
                })
                .catch(error => console.error('獲取數據時出錯:', error));
        }

        // 使用事件監聽器，避免多次觸發
        window.addEventListener('resize', () => {
            clearTimeout(window.chartResizeTimer);
            window.chartResizeTimer = setTimeout(drawChart, 250);
        });
    </script>
</head>
<body>
    <div id="chart_div"></div>
</body>
</html>
