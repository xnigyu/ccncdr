<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>滿版置中 RWD 圖片（無滾動條）</title>
  <style>
    /* 讓頁面充滿螢幕且無滾動條 */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* 🚫 防止出現 scrollbars */
      background: #f7f7f7;
    }

    /* 滿版容器：置中顯示 */
    .full-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    /* 圖片 RWD：保持比例，不超出畫面 */
    .media {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <main class="full-viewport">
    <img class="media" src="4.gif" alt="氣候降尺度技術應用於水庫未來45天雨量推估">
  </main>
</body>
</html>
