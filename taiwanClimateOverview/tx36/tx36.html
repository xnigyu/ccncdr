<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Chart Example</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
        google.charts.load('current', {'packages':['corechart', 'bar']});
        google.charts.setOnLoadCallback(drawChart);

        function getParameterByName(name, url) {
            if (!url) url = window.location.href;
            name = name.replace(/[\[\]]/g, '\\$&');
            const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
                results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }

        async function fetchData(file) {
            const response = await fetch(file);
            const data = await response.json();
            return data.DataList;
        }

        function roundUpToNearest10Plus5(num) {
            return Math.ceil(num / 10) * 10 + 5;
        }

        async function drawChart() {
            const file = getParameterByName('file');
            if (!file) {
                alert('缺少 file 參數');
                return;
            }

            const dataList = await fetchData(file);
            const data = new google.visualization.DataTable();
            data.addColumn('number', 'Year');
            data.addColumn('number', '超過36度的天數');

            let maxTx36 = 0;

            dataList.forEach(item => {
                data.addRow([item.Year, item.TX36]);
                if (item.TX36 > maxTx36) {
                    maxTx36 = item.TX36;
                }
            });

            // 格式化年份
            var yearFormatter = new google.visualization.NumberFormat({ pattern: '####' });
            yearFormatter.format(data, 0);  // 0 是 Year 列的索引

            const maxYValue = roundUpToNearest10Plus5(maxTx36);

            const chartContainer = document.getElementById('columnchart_material');
            const chart = new google.visualization.ColumnChart(chartContainer);

            function getResponsiveOptions() {
                const chartWidth = chartContainer.clientWidth || window.innerWidth;
                const chartHeight = chartContainer.clientHeight || window.innerHeight;
                const isNarrow = chartWidth < 560;

                // 小尺寸視窗縮減留白，避免座標軸、圖例或年份遭到裁切。
                const chartMargins = isNarrow
                    ? { left: 62, right: 12, top: 52, bottom: 45 }
                    : { left: 78, right: 24, top: 55, bottom: 52 };

                const yearStep = chartWidth < 420 ? 20 : 10;
                const yearTicks = [...Array(Math.floor((2020 - 1960) / yearStep) + 1).keys()]
                    .map(i => 1960 + i * yearStep);

                return {
                legend: { position: 'top', alignment: 'start', textStyle: { fontSize: 14, color: '#333',bold: true } },
                hAxis: { 
                    title: '年份', 
                    titleTextStyle: {
                        fontSize: 14, // 调整标题文字大小，单位是像素
                        bold: true    // 你也可以设置文字为粗体
                    },
                    viewWindow: { min: 1960, max: 2022 }, 
                    ticks: yearTicks,
                    gridlines: { color: 'transparent' },
                    format: '####',
                    textStyle: {
                        fontSize: isNarrow ? 11 : 14, // 調整字體大小
                        bold: true
                    }
                },
                vAxis: { 
                    title: '超過36度的天數',
                    titleTextStyle: {
                        fontSize: 14, // 调整标题文字大小，单位是像素
                        bold: true    // 你也可以设置文字为粗体
                    }, 
                    format: 'decimal', 
                    viewWindow: { min: 0, max: maxYValue }, 
                    gridlines: { count: -1, color: '#e0e0e0' },
                    textStyle: {
                        fontSize: 14, // 調整字體大小
                        bold: true
                    }
                },
                width: chartWidth,
                height: chartHeight,
                colors: ['#EC7D31'],
                animation: {
                    duration: 500,
                    easing: 'swing',
                    startup: true
                },
                tooltip: { 
                    textStyle: { fontSize: 14 }, 
                    isHtml: true,
                    trigger: 'focus'
                },
                chartArea: {
                    left: chartMargins.left,
                    right: chartMargins.right,
                    top: chartMargins.top,
                    bottom: chartMargins.bottom,
                    width: Math.max(chartWidth - chartMargins.left - chartMargins.right, 1),
                    height: Math.max(chartHeight - chartMargins.top - chartMargins.bottom, 1)
                },
                bar: { groupWidth: '80%' }
                };
            };

            function renderChart() {
                chart.draw(data, getResponsiveOptions());
            }

            renderChart();

            let resizeTimer;
            window.addEventListener('resize', () => {
                window.clearTimeout(resizeTimer);
                resizeTimer = window.setTimeout(renderChart, 120);
            });
        }
    </script>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        #columnchart_material {
            width: 100vw;
            height: 100vh;
            min-width: 0;
            min-height: 0;
        }
    </style>
</head>
<body>
    <div id="columnchart_material"></div>
</body>
</html>
